<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Pesquisa de mercado</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <h1>Pesquisa de mercado</h1>
      <p>Entre com seu e-mail e senha cadastrados.</p>

      <div id="erro" class="error-message" style="display: none;"></div>

      <form id="form-login">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn" id="btn-entrar">Entrar</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { login, redirecionarSeJaLogado } from "./js/auth.js";

    // Se a pessoa já estiver logada, nem mostra o formulário — já manda pra tela de projetos.
    redirecionarSeJaLogado();

    const form = document.getElementById("form-login");
    const erroEl = document.getElementById("erro");
    const btnEntrar = document.getElementById("btn-entrar");

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      erroEl.style.display = "none";
      btnEntrar.disabled = true;
      btnEntrar.textContent = "Entrando...";

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      const resultado = await login(email, senha);

      if (resultado.sucesso) {
        window.location.href = "projetos.html";
        return;
      }

      erroEl.textContent = resultado.mensagem;
      erroEl.style.display = "block";
      btnEntrar.disabled = false;
      btnEntrar.textContent = "Entrar";
    });
  </script>
</body>
</html>
